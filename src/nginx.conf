user nginx;
worker_processes  4;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections  65535;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # access_log  /usr/share/nginx/html/access.log  main;
    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 1024m;
     
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 600;
    tcp_nodelay on;

    fastcgi_connect_timeout 600;
    fastcgi_send_timeout 600;
    fastcgi_read_timeout 600;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_max_temp_file_size 1024m;

    gzip on; 
    gzip_min_length 1k;
    gzip_buffers 4 64k;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_types text/plain application/x-javascript text/css application/xml application/json;
    gzip_vary on;
    
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    proxy_buffer_size 128k;
    proxy_buffers 4 128k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 1024m;

    underscores_in_headers on;

    server {
        listen 8888;
        server_name _;

        default_type 'text/html';
        charset "UTF-8";

        root   /usr/share/nginx/html;
        index  index.html;

        location /error.html {
            root   /usr/share/nginx/html;
            expires 365d;
        }

        # 后端服务
        location /backend/ {
            proxy_pass http://127.0.0.1:3664/;
            proxy_set_header X-Real_IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_cookie_path / "/; Path=/; Secure; HttpOnly";
        }

        # 任务后的文件下载
        location /task_result/ {
            # alias /winter/CDesk/backend/static/TaskResults/;
            # expires 365d;
            proxy_pass http://127.0.0.1:3664/;
            proxy_set_header X-Real_IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_cookie_path / "/; Path=/; Secure; HttpOnly";
        }

        # 前端页面
        location / {
            if ($request_uri ~* .*[.](js|css|map|jpg|png|svg|ico)$) {
                add_header Cache-Control "public, max-age=2592000";#非html缓存1个月
            }
            
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
            
            # proxy_pass http://172.16.75.160:3000/;
            # proxy_set_header X-Real_IP $remote_addr;
            # proxy_set_header Host $http_host;
            # proxy_cookie_path / "/; Path=/; Secure; HttpOnly";
        }
    }
}